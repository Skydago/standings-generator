# Builds the Windows installers and publishes a GitHub Release with the
# signed updater artifacts + latest.json, which the in-app updater reads.
# Triggered by pushing a tag like v1.2.0 (see scripts/release.ps1).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VGC Standings Generator ${{ github.ref_name }}'
          releaseBody: 'Scarica e installa il file *-setup.exe. Le installazioni esistenti si aggiornano da sole all''avvio.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
